<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan 12 Semanas</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0E0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan 12">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0E0C;--card:#131A16;--card2:#1A231E;--line:#24302A;--txt:#ECF4EF;--mut:#8C9C94;--acc:#3DDC84;--acc2:#A6F5C4;--grad:linear-gradient(135deg,#3DDC84 0%,#14A85A 100%);--sos:#FF7A45;--sosg:linear-gradient(135deg,#FF9A5A 0%,#FF5A3C 100%);--gold:#FFC857;--blue:#5BB8FF;--purple:#A98BFF;--red:#FF6B6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.meal,.hab,.it,.opt{touch-action:manipulation}
[data-stepsetup]{color:var(--acc2);cursor:pointer}
html{background:var(--bg)}
body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.45;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.num,.big{font-family:"Space Grotesk",Inter,sans-serif;font-variant-numeric:tabular-nums}
main{padding:calc(14px + env(safe-area-inset-top)) 14px 14px;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top .hi{font-size:13px;color:var(--mut)}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sync{font-size:11px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:4px 9px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card h2{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .mut{font-weight:500}
.mut{color:var(--mut);font-size:13px}
.hero{background:radial-gradient(120% 120% at 100% 0%,#1d3a2b 0%,#131A16 55%);display:flex;gap:14px;align-items:center}
.hero .l{flex:1;min-width:0}
.hero .big{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
.chip.fire{color:var(--gold);border-color:#4a3b16;background:#221c0e}
.chip.lv{color:var(--acc2)}
.xpbar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:"Space Grotesk",Inter,sans-serif;font-size:24px;display:block;line-height:1}
.ring .c span{font-size:10.5px;color:var(--mut)}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.quote{font-size:14px;color:var(--acc2);font-weight:600;padding:12px 14px;border-left:3px solid var(--acc);background:#0f1713;border-radius:0 14px 14px 0;margin-bottom:12px}
.goal .track{height:12px;background:var(--card2);border-radius:12px;overflow:hidden;margin:10px 0 6px}
.goal .track i{display:block;height:100%;background:var(--grad);border-radius:12px;transition:width .8s}
.row2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.btn{font:inherit;border:none;border-radius:14px;padding:13px 16px;background:var(--grad);color:#05210f;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.w{width:100%}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:700}
.btn.sos{background:var(--sosg);color:#fff}
.btn.pur{background:linear-gradient(135deg,#B9A2FF,#7B5CFF);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.4}
.hard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#221a3a,#151320);border-color:#382c5c;cursor:pointer}
.hard .ic{font-size:28px}
.hard b{display:block;font-size:15px}
.train{background:linear-gradient(135deg,#123d27,#0f2219);border-color:#1f5a3a}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card2);margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:all .2s;user-select:none}
.meal .ck{width:28px;height:28px;border-radius:50%;border:2px solid #3a4a42;flex:none;display:grid;place-items:center;transition:all .25s}
.meal.on{border-color:#1f5a3a;background:#12251a}
.meal.on .ck{background:var(--acc);border-color:var(--acc);transform:scale(1.05)}
.meal.on .ck::after{content:"";width:7px;height:12px;border:solid #05210f;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.meal .b{flex:1;min-width:0}
.meal .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.meal .t span{font-weight:600;font-size:12px;color:var(--mut);white-space:nowrap}
.meal .d{font-size:13px;color:var(--mut);margin-top:2px}
.meal.on .d{opacity:.6}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mbar .h{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.mbar .h b{color:var(--txt);font-family:"Space Grotesk",Inter,sans-serif}
.mbar .tr{height:7px;background:var(--card2);border-radius:7px;overflow:hidden;margin-top:4px}
.mbar .tr i{display:block;height:100%;border-radius:7px;transition:width .5s}
.water{display:flex;align-items:center;gap:14px}
.bottle{width:62px;height:110px;border:3px solid #2f4a5c;border-radius:14px 14px 18px 18px;position:relative;overflow:hidden;flex:none;background:#0d1419}
.bottle::before{content:"";position:absolute;top:-10px;left:18px;width:20px;height:10px;border:3px solid #2f4a5c;border-bottom:none;border-radius:4px 4px 0 0}
.bottle i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#7cc8ff,#2f8fd8);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bottle i::before{content:"";position:absolute;top:-6px;left:-20%;width:140%;height:12px;background:#7cc8ff;border-radius:50%;opacity:.7}
.water .big{font-size:28px;font-weight:700}
.water .wbtns{display:flex;gap:8px;margin-top:8px}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hab{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;transition:all .2s;user-select:none}
.hab .e{font-size:22px}
.hab b{display:block;font-size:13.5px;margin-top:4px}
.hab span{font-size:11.5px;color:var(--mut)}
.hab.on{background:#12251a;border-color:#2c7a4f}
.hab.on b::after{content:" ✓";color:var(--acc)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card2);color:var(--txt);width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:#5f6e66}
input[type=date]{color-scheme:dark}
.inl{display:flex;gap:8px;align-items:center}
.inl input{flex:1}
.prev{background:linear-gradient(135deg,#14202a,#11181d);border-color:#22384a}
.prev .e{font-size:22px;margin-right:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,17,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:0 6px env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 9px;font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--acc)}
nav .sosb{flex:none;width:66px;height:66px;margin:-22px 6px 8px;border-radius:50%;background:var(--sosg);color:#fff;box-shadow:0 8px 24px rgba(255,90,60,.45),0 0 0 5px var(--bg);font-weight:800;font-size:12px;gap:0;padding:0;justify-content:center;animation:pulse 2.6s infinite}
nav .sosb svg{width:24px;height:24px}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(255,90,60,.45),0 0 0 5px var(--bg)}50%{box-shadow:0 8px 30px rgba(255,90,60,.7),0 0 0 5px var(--bg)}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;background:none;border:none;color:var(--mut);padding:9px 6px;font:inherit;font-size:13px;font-weight:700;border-radius:10px;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:none;padding-top:2px}
.ex .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex .name{font-weight:800;font-size:16px}
.ex select{width:auto;max-width:100%;padding:6px 8px;font-size:12.5px;margin-top:6px;border-radius:9px}
.sets{display:grid;grid-template-columns:30px 1fr 1fr 40px;gap:7px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.sets .n{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;text-align:center;color:var(--mut)}
.sets input{text-align:center;padding:10px 4px;font-family:"Space Grotesk",Inter,sans-serif;font-size:16px;font-weight:700}
.ok{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center;transition:all .2s}
.ok.on{background:var(--acc);border-color:var(--acc)}
.ok.on::after{content:"";width:7px;height:13px;border:solid #05210f;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sug{font-size:13px;margin-top:8px;padding:8px 11px;border-radius:11px;background:var(--card2);color:var(--mut)}
.sug.up{background:#12301f;color:var(--acc2);font-weight:700}
.sug.down{background:#2e2112;color:var(--gold)}
.note{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}
.note.g{border-color:#1f5a3a;background:#10221a}
.note.o{border-color:#5a3a1f;background:#22180f}
#timer{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));background:#1e2a24;border:1px solid #2f4239;border-radius:18px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;z-index:19;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:532px;margin:0 auto}
#timer b{font-size:26px}
#timer.end{background:#164a2e;border-color:var(--acc)}
details summary{cursor:pointer;font-weight:700;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--mut)}
details[open] summary::after{content:" ▴"}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.list .it:first-child{border-top:none}
.list .it .ck{width:24px;height:24px;border-radius:8px;border:2px solid #3a4a42;flex:none;display:grid;place-items:center;margin-top:1px;transition:all .2s}
.list .it.on .ck{background:var(--acc);border-color:var(--acc)}
.list .it.on .ck::after{content:"";width:6px;height:11px;border:solid #05210f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.list .it .t{font-weight:600;font-size:14px}
.list .it .d{font-size:12.5px;color:var(--mut)}
.list .it.on .t,.list .it.on .d{text-decoration:line-through;opacity:.45}
.qty{display:inline-block;font-size:11.5px;font-weight:700;color:var(--acc2);background:#12301f;border-radius:99px;padding:1px 8px;margin-left:4px}
.cat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 4px}
.pbar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-bottom:6px}
.pbar i{display:block;height:100%;background:var(--grad);transition:width .5s}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.r{text-align:right}
.green{color:var(--acc)}.amber{color:var(--gold)}.red{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-family:"Space Grotesk",Inter,sans-serif;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.badge .e{font-size:28px;filter:grayscale(1);opacity:.35}
.badge b{display:block;font-size:11.5px;margin-top:4px;color:var(--mut)}
.badge.on{border-color:#5a4a1f;background:linear-gradient(160deg,#2a2210,#15130c)}
.badge.on .e{filter:none;opacity:1}
.badge.on b{color:var(--gold)}
.hide{display:none!important}
/* sheet */
#back{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:#111814;border-top:1px solid var(--line);border-radius:26px 26px 0 0;z-index:31;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:5px;background:#33413a;margin:0 auto 12px}
#sheet .x{position:absolute;right:14px;top:12px;background:var(--card2);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
#sheet h3{font-size:22px;margin:4px 0 6px;letter-spacing:-.02em}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer;transition:all .15s;width:100%;color:var(--txt);font:inherit;text-align:left}
.opt:active{transform:scale(.98)}
.opt .e{font-size:26px}
.opt b{display:block;font-size:15px}
.opt span{font-size:12.5px;color:var(--mut)}
.tip{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tip:first-child{border-top:none}
.tip .e{font-size:20px;flex:none}
.breath{width:190px;height:190px;margin:18px auto;position:relative;display:grid;place-items:center}
.breath .o{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#3DDC8455,#3DDC8411 70%);border:2px solid #3DDC8466;transform:scale(.55);transition:transform 4s ease-in-out}
.breath .lbl{position:relative;font-weight:800;font-size:18px;text-align:center}
.breath .lbl small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.bigtimer{font-family:"Space Grotesk",Inter,sans-serif;font-size:56px;font-weight:700;text-align:center;margin:10px 0}
.sostim{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--sosg);color:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:13px;z-index:25;cursor:pointer;box-shadow:0 6px 18px rgba(255,90,60,.4)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);background:#1e2a24;border:1px solid #2f4239;color:var(--txt);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:40;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fx{position:fixed;z-index:45;font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;color:var(--acc);pointer-events:none;animation:fx 1s ease-out forwards;font-size:15px}
@keyframes fx{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1.4)}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.why{font-size:16px;font-weight:700;color:var(--acc2);background:#10221a;border:1px solid #1f5a3a;border-radius:14px;padding:12px 14px;margin:8px 0 12px;white-space:pre-wrap}
</style>
</head>
<body>
<main>
  <section id="v-hoy"></section>
  <section id="v-entreno" class="hide"></section>
  <section id="v-cocina" class="hide"></section>
  <section id="v-progreso" class="hide"></section>
</main>
<div id="timer"><div><div class="mut" id="tLabel" style="font-size:12px">Descanso</div><b class="num" id="tTime">0:00</b></div><div class="inl"><button class="btn ghost sm" id="tAdd">+30 s</button><button class="btn sm" id="tStop">Listo</button></div></div>
<div id="sostim" class="sostim hide"></div>
<div class="toast" id="toast"></div>
<canvas id="conf"></canvas>
<div id="back"></div>
<div id="sheet"><div class="grab"></div><button class="x" id="sx">×</button><div id="sbody"></div></div>
<nav>
  <button data-v="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</button>
  <button data-v="entreno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Entreno</button>
  <button class="sosb" id="sosBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.5-3.7.2 1.4 1 2.2 2 2.2 0-2.5-.5-4.5.5-7z"/></svg>SOS</button>
  <button data-v="cocina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z"/><path d="M8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4M16 7c0-2 2-2 2-4"/></svg>Cocina</button>
  <button data-v="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Progreso</button>

  if(j.steps)STEPS=j.steps;const lu=+lsRaw("updatedAt")||0;
  if(j.data&&j.updatedAt>lu){KEYS.forEach(k=>{if(j.data[k]){merge(k,j.data[k]);lsSet(k,S[k])}});lsRawSet("updatedAt",String(j.updatedAt))}
  setSync("☁ Sincronizado");applySteps();return true}catch(e){setSync("Guardado en este equipo");return false}}
async function initStore(){KEYS.forEach(k=>{const v=lsGet(k);if(v)merge(k,v)});render(VIEW);await pullData();pushData();render(VIEW)}
document.addEventListener("visibilitychange",async()=>{if(document.hidden){if(pending){clearTimeout(pushT);pushData(true)}}else{await pullData();render(VIEW);pushData()}});

/* ===================== FECHAS ===================== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
const startD=()=>parse(S.settings.start);
function dayNum(d){return Math.round((d-startD())/864e5)+1}
function weekOf(d){const n=dayNum(d);return n<1?0:Math.floor((n-1)/7)+1}
function mondayOf(d){return addD(d,-((d.getDay()+6)%7))}
function cookKey(d){if(d<addD(startD(),-2))return iso(startD());const wd=d.getDay();return iso(wd===6?addD(d,2):wd===0?addD(d,1):mondayOf(d))}
const isTrain=d=>[1,3,5].includes(d.getDay());
const deload=w=>w===7||w===12;
const stepsGoal=w=>Math.min(10000,6000+1000*Math.max(0,w-1));

/* ===================== SCORE / XP / RACHA ===================== */
function day(k){if(!S.daily[k])S.daily[k]={m:[],water:0,crea:false,steps:false};return S.daily[k]}
function sessOn(k){return S.workouts.sessions.some(s=>s.date===k)}
function score(k){const d=S.daily[k]||{m:[]},dt=parse(k),train=isTrain(dt)&&weekOf(dt)>0;
  const wg=train?9:8;let done=(d.m||[]).filter(Boolean).length,tot=5;
  tot+=4;if(d.water>=wg)done++;if(d.crea)done++;if(d.steps)done++;if(S.body.w[k])done++;
  if(train){tot++;if(sessOn(k))done++}
  const minOk=d.min&&d.min.slice(0,3).every(Boolean);
  return{done,tot,pct:done/tot,minOk}}
const win=k=>{const s=score(k);return s.pct>=.7||s.minOk};
function streakInfo(){const t=today();let st=startD();if(t<st)return{cur:0,max:0};
  let cur=0,max=0,run=0;for(let d=new Date(st);d<=t;d=addD(d,1)){const k=iso(d);if(win(k)){run++;max=Math.max(max,run)}else if(iso(d)!==iso(t))run=0}
  cur=run;return{cur,max}}
function xp(){let x=0;Object.entries(S.daily).forEach(([k,d])=>{const train=isTrain(parse(k));x+=(d.m||[]).filter(Boolean).length*10+Math.min(d.water||0,train?9:8)*2+(d.crea?5:0)+(d.steps?10:0);if(d.min&&d.min.slice(0,3).every(Boolean))x+=25});
  x+=Object.keys(S.body.w).length*5+Object.keys(S.body.waist).length*5;x+=S.workouts.sessions.length*60;
  S.sos.log.forEach(l=>{x+=l.out==="win"?20:l.out==="plan"?10:5});
  Object.values(S.prep).forEach(p=>{x+=Object.values(p).filter(Boolean).length*5});return x}
function lvl(x){const per=400;const n=Math.floor(x/per);return{n:n+1,name:LEVELS[Math.min(n,LEVELS.length-1)],pct:(x%per)/per,left:per-(x%per)}}
function weekAvgs(){const ws={};Object.entries(S.body.w).forEach(([d,v])=>{const w=weekOf(parse(d));(ws[w]=ws[w]||[]).push(v)});
  return Object.keys(ws).map(Number).sort((a,b)=>a-b).map(w=>({w,avg:ws[w].reduce((a,b)=>a+b,0)/ws[w].length,n:ws[w].length}))}
function curAvg(){const e=Object.entries(S.body.w).sort();if(!e.length)return null;const last=parse(e[e.length-1][0]);const win=e.filter(([d])=>(last-parse(d))<7*864e5);return win.reduce((a,[,v])=>a+v,0)/win.length}
function allStats(){const si=streakInfo(),ca=curAvg(),we=Object.entries(S.body.waist).sort();
  const batch=Object.values(S.prep).filter(p=>PREP_SUN.every((_,i)=>p["d"+i])).length;
  return{ses:S.workouts.sessions.length,maxStreak:si.max,cur:si.cur,batch,wins:S.sos.log.filter(l=>l.out==="win"||l.out==="plan").length,
   mins:Object.values(S.daily).filter(d=>d.min&&d.min.slice(0,3).every(Boolean)).length,lost:ca?Math.max(0,S.settings.startWeight-ca):0,cm:we.length>1?we[0][1]-we[we.length-1][1]:0}}

/* ===================== UI HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2000)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p||12)}catch(e){}}
function fx(ev,txt){if(!ev||ev.clientX===undefined)return;const e=document.createElement("div");e.className="fx";e.textContent=txt;e.style.left=(ev.clientX-20)+"px";e.style.top=(ev.clientY-20)+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
function confetti(n){const c=$("#conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#3DDC84","#A6F5C4","#FFC857","#FF7A45","#5BB8FF","#A98BFF"];
  const P=Array.from({length:n||140},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*7+4,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();buzz([20,40,20])}
function ring(p,size,stroke,col){const r=(size-stroke)/2,c=2*Math.PI*r;return`<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#1F2A24" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col||"url(#g1)"}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A6F5C4"/><stop offset="1" stop-color="#14A85A"/></linearGradient></defs></svg>`}
/* sheet */
let onClose=null;
function openSheet(html,mount,close){$("#sbody").innerHTML=html;$("#back").classList.add("on");$("#sheet").classList.add("on");$("#sheet").scrollTop=0;onClose=close||null;mount&&mount($("#sbody"))}
function closeSheet(){$("#back").classList.remove("on");$("#sheet").classList.remove("on");if(onClose){const f=onClose;onClose=null;f()}}
$("#back").onclick=closeSheet;$("#sx").onclick=closeSheet;

document.querySelectorAll("nav button[data-v]").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("#sosBtn").onclick=()=>{buzz();openSOS()};
function show(v){VIEW=v;document.querySelectorAll("nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));["hoy","entreno","cocina","progreso"].forEach(x=>$("#v-"+x).classList.toggle("hide",x!==v));render(v);window.scrollTo(0,0)}
function render(v){({hoy:rHoy,entreno:rEntreno,cocina:rCocina,progreso:rProgreso})[v]()}
function topbar(title,sub){return`<div class="top"><div><div class="hi">${sub}</div><h1>${title}</h1></div><span class="sync" id="syncL">${SYNC}</span></div>`}

/* ===================== HOY ===================== */
function rHoy(){
  const t=today(),k=iso(t),wd=t.getDay(),w=weekOf(t),n=dayNum(t),D=day(k),plan=MEALS[wd],train=isTrain(t)&&w>0;
  const sc=score(k),si=streakInfo(),X=xp(),L=lvl(X),st=allStats();
  const hr=new Date().getHours(),greet=hr<12?"Buen día":hr<20?"Buenas tardes":"Buenas noches";
  const big=n<1?`Arrancás en ${1-n} día${1-n===1?"":"s"}`:n>84?"Bloque 1 completo":`Día ${n} <span class="mut" style="font-size:16px">de 84</span>`;
  let h=topbar(`${greet}, Nacho`,`${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][wd]} ${fmt(t)}${w>0&&w<=12?` · Semana ${w}${deload(w)?" · Descarga":""}`:""}`);
  h+=`<div class="card hero"><div class="l"><div class="big">${big}</div>
     <div class="chips"><span class="chip fire">🔥 ${si.cur} día${si.cur===1?"":"s"} de racha</span><span class="chip lv">⭐ Nv ${L.n} · ${L.name}</span></div>
     <div class="xpbar"><i style="width:${L.pct*100}%"></i></div><div class="mut" style="font-size:11.5px;margin-top:4px">${X} XP · faltan ${L.left} para el nivel ${L.n+1}</div></div>
     <div class="ring">${ring(sc.pct,96,10)}<div class="c"><div><b>${Math.round(sc.pct*100)}%</b><span>de hoy</span></div></div></div></div>`;
  if(!S.settings.why) h+=`<div class="card"><h2>✍️ ¿Por qué estás haciendo esto?</h2><div class="mut" style="margin-bottom:8px">Escribilo con tus palabras. En los días en que no tengas ganas, la app te lo va a mostrar.</div><textarea id="whyIn" rows="2" placeholder="Ej.: Quiero tener energía para mis hijos, verme bien en la foto de fin de año, dejar de sentirme cansado…"></textarea><button class="btn w" style="margin-top:8px" id="whyB">Guardar mi porqué</button></div>`;
  if(!S.settings.pushOn) h+=`<div class="card" style="background:linear-gradient(135deg,#2a1d10,#16110b);border-color:#5a3a1f;display:flex;gap:12px;align-items:center"><div style="font-size:28px">🔔</div><div style="flex:1"><b>Activá los recordatorios</b><div class="mut">Agua, creatina, pasos y gimnasio, en el momento justo</div></div><button class="btn sm sos" id="nBan">Activar</button></div>`;
  h+=`<div class="quote">“${QUOTES[(Math.max(1,n)+t.getMonth())%QUOTES.length]}”</div>`;
  // goal
  const ca=curAvg(),sw=S.settings.startWeight,gl=S.settings.goal;const prog=ca?Math.max(0,Math.min(1,(sw-ca)/(sw-gl))):0;
  h+=`<div class="card goal"><h2>🎯 Meta del bloque 1 <span class="mut">${ca?ca.toFixed(1)+" kg":"sin datos"}</span></h2><div class="track"><i style="width:${prog*100}%"></i></div>
     <div class="row2"><span>${sw} kg</span><span>${ca?(ca<=gl?"¡Meta lograda! 🎉":`faltan ${(ca-gl).toFixed(1)} kg`):"Cargá tu peso para ver el avance"}</span><span>${gl} kg</span></div></div>`;
  h+=`<div class="card hard" id="hardB"><div class="ic">😮‍💨</div><div style="flex:1"><b>Hoy no tengo ganas</b><span class="mut">Abrí el modo día difícil: un plan mínimo para no soltar la racha</span></div><div style="color:var(--purple);font-size:22px">›</div></div>`;
  const mm=M(),wkk=iso(mondayOf(t)),revDone=!!mm.rev[wkk];
  h+=`<div class="card" style="background:linear-gradient(135deg,#10222a,#0f1619);border-color:#1f4050"><h2>🧠 Coach mental</h2>${mm.id?`<div class="why" style="font-size:14px;margin-top:0">${esc(mm.id)}</div>`:""}<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
   <button class="btn ghost sm" data-co="habitos">🌱 Hábitos</button><button class="btn ghost sm" data-co="frust">😤 Frustración</button><button class="btn ghost sm" data-co="wins">🏆 Victorias</button><button class="btn ghost sm" data-co="rew">🎁 Premios</button></div>
   ${(wd===0||wd===1)&&!revDone&&n>1?`<button class="btn w" style="margin-top:10px" data-co="rev">📝 Hacer la revisión semanal (5 min)</button>`:`<button class="btn ghost sm" style="margin-top:8px;width:100%" data-co="rev">📝 Revisión semanal${revDone?" ✓":""}</button>`}</div>`;
  if(D.min&&D.min.slice(0,3).every(Boolean)) h+=`<div class="note g">💜 <b>Plan mínimo cumplido.</b> Hoy cuenta para la racha. Ese es el músculo más importante.</div>`;
  if(train){const ns=nextSession(),done=sessOn(k);h+=`<div class="card train"><h2>${done?"✅ Sesión de hoy hecha":"🏋️ Hoy toca gimnasio"} <span class="chip">Sesión ${done?S.workouts.sessions.filter(s=>s.date===k).slice(-1)[0].type:ns}</span></h2><div class="mut" style="margin-bottom:12px">${done?"Bien ahí. La recuperación también es entrenamiento: proteína, agua y a dormir 7 horas.":deload(w)?"Semana de descarga: 2 series, mismo peso, dejando 4 repeticiones en reserva.":w<=2?"Pesos cómodos: hoy se aprende la técnica.":"Calentamiento de 10 min, la sesión y cinta inclinada al final."}</div>${done?"":`<button class="btn w" onclick="show('entreno')">Empezar la sesión →</button>`}</div>`}
  if(wd===6) h+=`<div class="card prev"><h2>🛒 Hoy son las compras</h2><button class="btn w" onclick="CTAB='compras';show('cocina')">Abrir la lista →</button></div>`;
  if(wd===0) h+=`<div class="card prev"><h2>🍳 Hoy es el batch cooking</h2><button class="btn w" onclick="CTAB='domingo';show('cocina')">Ver el paso a paso →</button></div>`;
  // meals
  let kc=0,pr=0;plan.meals.forEach((m,i)=>{if(D.m[i]){kc+=m.k;pr+=m.p}});const tk=plan.meals.reduce((a,m)=>a+m.k,0),tp=plan.meals.reduce((a,m)=>a+m.p,0);
  h+=`<div class="card"><h2>🍽️ ${esc(plan.tema)}<span class="mut">${(D.m||[]).filter(Boolean).length}/5</span></h2>
    <div class="macros"><div class="mbar"><div class="h"><span>Calorías</span><b>${kc} / ${tk}</b></div><div class="tr"><i style="width:${kc/tk*100}%;background:var(--grad)"></i></div></div>
    <div class="mbar"><div class="h"><span>Proteína</span><b>${pr} / ${tp} g</b></div><div class="tr"><i style="width:${pr/tp*100}%;background:linear-gradient(90deg,#5BB8FF,#2f8fd8)"></i></div></div></div>`;
  h+=`<div class="mut" style="font-size:12px;margin:-4px 0 10px">Pollo y carne vacuna: peso cocido (en crudo es ~33 % más). Carne picada: peso en crudo.</div>`;
  plan.meals.forEach((m,i)=>{h+=`<div class="meal ${D.m[i]?"on":""}" data-meal="${i}"><div class="ck"></div><div class="b"><div class="t">${m.n}<span>${m.k} kcal · ${m.p} g P</span></div><div class="d">${esc(m.d)}</div></div></div>`});
  h+=`</div>`;
  // water
  const wg=train?9:8;h+=`<div class="card"><h2>💧 Agua<span class="mut">${train?"día de entreno":"día de descanso"}</span></h2><div class="water"><div class="bottle"><i style="height:${Math.min(100,D.water/wg*100)}%"></i></div>
    <div style="flex:1"><div class="big">${(D.water*.5).toFixed(1)} <span class="mut" style="font-size:15px">/ ${(wg*.5).toFixed(1)} L</span></div><div class="mut">${D.water>=wg?"¡Objetivo cumplido! 💧":`Te faltan ${((wg-D.water)*.5).toFixed(1)} L. El mate amargo cuenta.`}</div>
    <div class="wbtns"><button class="btn sm" id="wPlus">+ 500 ml</button><button class="btn ghost sm" id="wMinus">−</button></div></div></div></div>`;
  // habits
  h+=`<div class="card"><h2>⚡ Hábitos</h2><div class="habits">
    <div class="hab ${D.crea?"on":""}" data-h="crea"><div class="e">💊</div><b>Creatina</b><span>5 g con una comida</span></div>
    <div class="hab ${D.steps?"on":""}" data-h="steps"><div class="e">👟</div><b>${stepsGoal(Math.max(1,w)).toLocaleString("es-AR")} pasos</b>${stepsTxt(w)}</div></div>
    <div style="margin-top:12px"><div class="mut" style="margin-bottom:6px">⚖️ Peso en ayunas${S.body.w[k]?` · <span class="green">cargado</span>`:""}</div><div class="inl"><input type="number" step="0.1" inputmode="decimal" id="qW" placeholder="kg" value="${S.body.w[k]??""}"><button class="btn sm" id="qWb">Guardar</button></div></div>
    ${wd===1?`<div style="margin-top:10px"><div class="mut" style="margin-bottom:6px">📏 Cintura (los lunes)</div><div class="inl"><input type="number" step="0.5" inputmode="decimal" id="qC" placeholder="cm, a la altura del ombligo" value="${S.body.waist[k]??""}"><button class="btn sm" id="qCb">Guardar</button></div></div>`:""}</div>`;
  const tm=addD(t,1).getDay(),night=NIGHT[tm];
  if(night&&addD(t,1)>=addD(startD(),-3)) h+=`<div class="card prev"><h2>🌙 Previa para mañana</h2><div style="font-weight:600">${esc(night[0])}</div>${night[1]?`<div class="mut">${esc(night[1])}</div>`:""}</div>`;
  $("#v-hoy").innerHTML=h;const V=$("#v-hoy");
  V.querySelectorAll("[data-meal]").forEach(el=>el.onclick=ev=>{const i=+el.dataset.meal;const was=score(k).pct;D.m[i]=!D.m[i];save("daily");buzz();if(D.m[i])fx(ev,"+10 XP");after(was,k)});
  V.querySelectorAll("[data-h]").forEach(el=>el.onclick=ev=>{const was=score(k).pct;D[el.dataset.h]=!D[el.dataset.h];save("daily");buzz();if(D[el.dataset.h])fx(ev,el.dataset.h==="steps"?"+10 XP":"+5 XP");after(was,k)});
  $("#wPlus").onclick=ev=>{const was=score(k).pct;D.water=(D.water||0)+1;save("daily");buzz();fx(ev,"+2 XP");if(D.water===wg)toast("💧 ¡Objetivo de agua cumplido!");after(was,k)};
  $("#wMinus").onclick=()=>{D.water=Math.max(0,(D.water||0)-1);save("daily");rHoy()};
  $("#qWb").onclick=ev=>{const v=parseFloat($("#qW").value.replace(",","."));if(v>30&&v<300){const was=score(k).pct,first=!S.body.w[k];S.body.w[k]=v;save("body");if(first)fx(ev,"+5 XP");toast("⚖️ Peso guardado");after(was,k)}};
  if($("#qCb"))$("#qCb").onclick=()=>{const v=parseFloat($("#qC").value.replace(",","."));if(v>40&&v<250){S.body.waist[k]=v;save("body");toast("📏 Cintura guardada");rHoy()}};
  $("#hardB").onclick=openHard;if($("#nBan"))$("#nBan").onclick=enablePush;V.querySelectorAll("[data-stepsetup]").forEach(x=>x.onclick=ev=>{ev.stopPropagation();openStepsSetup()});V.querySelectorAll("[data-co]").forEach(x=>x.onclick=()=>openCoach(x.dataset.co));
  if($("#whyB"))$("#whyB").onclick=()=>{const v=$("#whyIn").value.trim();if(v){S.settings.why=v;save("settings");toast("Guardado. Volvé a leerlo cuando haga falta.");rHoy()}};
}
function after(was,k){const now=score(k).pct;if(was<.7&&now>=.7){confetti();toast("🔥 ¡Día ganado! La racha sigue")}else if(was<1&&now>=1){confetti(200);toast("🏆 ¡Día perfecto!")}rHoy()}

/* ===================== DÍA DIFÍCIL ===================== */
function openHard(){
  const k=iso(today()),D=day(k);D.min=D.min||[false,false,false,false];const train=isTrain(today())&&weekOf(today())>0;const st=allStats();
  const y=iso(addD(today(),-1)),yLost=dayNum(addD(today(),-1))>=1&&!win(y);
  const items=["🍗 Proteína en cada comida, aunque no sea la del menú","💧 Al menos 2 litros de agua","🚫 Nada de calorías líquidas ni de picoteo fuera de horario"];
  if(train)items.push("🏋️ Regla de los 5 minutos: ir al gimnasio y hacer al menos el calentamiento y un ejercicio");
  const html=`<h3>Hoy no tenés ganas. Está bien.</h3><div class="mut" style="font-size:14px">No necesitás motivación, necesitás un plan mínimo. Los resultados no salen de los días buenos, salen de no soltar en los días malos.</div>
  ${S.settings.why?`<div class="cat">Tu porqué</div><div class="why">“${esc(S.settings.why)}”</div>`:`<div class="note o" style="margin-top:12px">Todavía no escribiste tu porqué. Hacelo en la pestaña Hoy: en días como este, es lo que más ayuda.</div>`}
  ${yLost?`<div class="note o">⚠️ Ayer no fue un buen día. <b>Regla de oro: nunca dos días seguidos.</b> Con cumplir el plan mínimo, hoy ya ganás.</div>`:""}
  <div class="cat">Lo que ya lograste</div>

function sosStep(k){

  openSheet(html,b=>{
    if(o.mode==="breath")startBreath();
    if(o.mode==="timer"){const B=b.querySelector("#stB");B.onclick=()=>{if(sosEnd<Date.now())sosEnd=Date.now()+600000;runSos();toast("⏳ 10 minutos. Podés cerrar esto: el contador sigue arriba")};if(sosEnd>Date.now())runSos()}
    b.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>sosEndFlow(k,x.dataset.o));
  },stopBreath);
}
function runSos(){clearInterval(sosInt);const tick=()=>{const r=Math.round((sosEnd-Date.now())/1000);const el=$("#st"),pill=$("#sostim");
  if(r<=0){clearInterval(sosInt);pill.classList.add("hide");if(el)el.textContent="0:00";toast("⏰ Pasaron 10 minutos. ¿Sigue el antojo?");buzz([100,60,100]);return}
  const s=`${Math.floor(r/60)}:${pad(r%60)}`;if(el)el.textContent=s;pill.textContent=`🔥 Antojo: ${s}`;pill.classList.toggle("hide",$("#sheet").classList.contains("on"))};tick();sosInt=setInterval(tick,500)}

function startBreath(){let ph=0,left=120;const seq=[["Inhalá",4000,1],["Sostené",4000,1],["Exhalá",6000,.55]];const o=$("#bo"),l=$("#bl"),c=$("#bc");

/* ===================== ENTRENO ===================== */
function nextSession(){const s=S.workouts.sessions;return s.length?(s[s.length-1].type==="A"?"B":"A"):"A"}
function variantName(ex,w){const v=S.draft.variants&&S.draft.variants[ex.id];if(v)return v;return(ex.early&&w>=1&&w<=4)?ex.early:ex.name}
function history(key){return S.workouts.sessions.filter(s=>s.ex&&s.ex[key]).map(s=>({date:s.date,sets:s.ex[key]}))}
function suggest(ex,key,w){const h=history(key);
  if(!h.length)return{kg:"",cls:"",txt:ex.noKg?`Empezá en ${ex.lo} s por serie.`:`Primera vez: elegí un peso con el que hagas ${ex.hi} ${ex.unit} cómodas, dejando 3 en reserva.`};
  const last=h[h.length-1].sets.filter(s=>s.reps>0),kg=ex.noKg?0:Math.max(...last.map(s=>+s.kg||0));
  if(deload(w))return{kg,cls:"",txt:`Descarga: mismo peso (${ex.noKg?"":kg+" kg"}), 2 series, con 4 en reserva.`};
  if(last.length>=ex.sets&&last.every(s=>s.reps>=ex.hi))return ex.noKg?{kg:0,cls:"up",txt:`🚀 ¡Tope alcanzado! Sumá ${ex.inc} s por serie.`}:{kg:+(kg+ex.inc).toFixed(1),cls:"up",txt:`🚀 ¡Tope alcanzado! Hoy subí a ${+(kg+ex.inc).toFixed(1)} kg.`};
  if(h.length>=3&&!ex.noKg){const tr=a=>a.reduce((x,s)=>x+(+s.reps||0),0),mx=a=>Math.max(...a.map(s=>+s.kg||0));const p=h[h.length-2].sets,p2=h[h.length-3].sets;
    if(mx(p)===kg&&mx(p2)===kg&&tr(last)<=tr(p)&&tr(p)<=tr(p2)){const nk=Math.round(kg*.9/2.5)*2.5;return{kg:nk,cls:"down",txt:`Estancado 2 sesiones: bajá a ${nk} kg y volvé a subir.`}}}
  return{kg,cls:"",txt:ex.noKg?`Última vez: ${last.map(s=>s.reps).join(" / ")} s. Buscá sumar segundos.`:`Mantené ${kg} kg y sumá repeticiones (última vez: ${last.map(s=>s.reps).join(" / ")}).`}}
function rEntreno(){
  const t=today(),w=Math.max(1,Math.min(12,weekOf(t)||1));
  if(!S.draft.type)S.draft={type:nextSession(),sets:{},variants:{},date:iso(t)};
  const d=S.draft,type=d.type;

    if(a.length){const f=a[0],l=a[a.length-1],up=f.kg?Math.round((l.kg/f.kg-1)*100):0;sr+=`<tr><td>${n}<div class="mut" style="font-size:11.5px">${esc(l.v)}</div></td><td class="r num">${f.kg}×${f.r}</td><td class="r num"><b>${l.kg}×${l.r}</b></td><td class="r num ${up>0?"green":""}">${up>0?"+"+up+"%":"—"}</td></tr>`}});
  h+=`<div class="card"><h2>💪 Fuerza</h2>${sr?`<table><tr><th>Ejercicio</th><th class="r">Inicio</th><th class="r">Ahora</th><th class="r">Δ</th></tr>${sr}</table>`:'<div class="mut">Acá vas a ver cómo suben tus pesos desde la primera sesión.</div>'}</div>`;
  const got=BADGES.filter(b=>b[3](st)).length;
  h+=`<div class="card"><h2>🏅 Logros<span class="mut">${got}/${BADGES.length}</span></h2><div class="badges">${BADGES.map(([id,e,n,f])=>`<div class="badge ${f(st)?"on":""}"><div class="e">${e}</div><b>${n}</b></div>`).join("")}</div></div>`;
  const sl=S.sos.log;if(sl.length){const by={};sl.forEach(l=>by[l.type]=(by[l.type]||0)+1);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];const hrs={};sl.forEach(l=>{const hh=new Date(l.t).getHours();hrs[hh]=(hrs[hh]||0)+1});const th=Object.entries(hrs).sort((a,b)=>b[1]-a[1])[0];
    h+=`<div class="card"><h2>🔥 Tus antojos</h2><div class="stats" style="margin:0"><div class="stat" style="background:var(--card2)"><b class="green">${sl.filter(l=>l.out!=="lost").length}</b><span>de ${sl.length} superados</span></div><div class="stat" style="background:var(--card2)"><b>${th[0]}:00</b><span>tu hora más crítica</span></div></div><div class="note" style="margin-top:10px">El disparador más común es <b>${SOS[top[0]].t.toLowerCase()}</b>. Dejá un plan armado para ese momento (por ejemplo, el mate listo o el snack porcionado).</div></div>`}
  h+=notifCard();
  h+=`<div class="card"><details><summary>⚙️ Ajustes y respaldo</summary><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div><div class="mut">Inicio (lunes)</div><input type="date" id="sSt" value="${S.settings.start}"></div><div><div class="mut">Peso inicial</div><input type="number" step="0.1" id="sW" value="${S.settings.startWeight}"></div><div><div class="mut">Meta bloque 1</div><input type="number" step="0.5" id="sG" value="${S.settings.goal}"></div></div>
     <div class="mut" style="margin-top:8px">Tu porqué</div><textarea id="sWhy" rows="2">${esc(S.settings.why||"")}</textarea><button class="btn sm" id="sSave" style="margin-top:8px">Guardar ajustes</button>
     <div class="mut" style="margin-top:14px">Respaldo: copiá tus datos o pegá uno para restaurarlo.</div><div class="inl" style="margin:8px 0"><button class="btn ghost sm" id="bCopy">Copiar mis datos</button><button class="btn ghost sm" id="bLoad">Restaurar</button></div><textarea id="bTxt" class="hide" placeholder="Pegá acá el respaldo y tocá Restaurar"></textarea></details></div>`;
  $("#v-progreso").innerHTML=h;bindNotif($("#v-progreso"));
  $("#pS").onclick=()=>{const d=$("#pD").value||k,w=parseFloat(($("#pW").value||"").replace(",",".")),c=parseFloat(($("#pC").value||"").replace(",","."));let ok=0;if(w>30&&w<300){S.body.w[d]=w;ok=1}if(c>40&&c<250){S.body.waist[d]=c;ok=1}if(ok){save("body");toast("✅ Guardado");rProgreso()}};
  $("#sSave").onclick=()=>{const s=$("#sSt").value;if(s)S.settings.start=s;const w=parseFloat($("#sW").value);if(w>30)S.settings.startWeight=w;const g=parseFloat($("#sG").value);if(g>30)S.settings.goal=g;S.settings.why=$("#sWhy").value.trim();save("settings");toast("Ajustes guardados");rProgreso()};
  $("#bCopy").onclick=()=>{const txt=JSON.stringify(S);navigator.clipboard.writeText(txt).then(()=>toast("Datos copiados")).catch(()=>{$("#bTxt").classList.remove("hide");$("#bTxt").value=txt;toast("Copialo del cuadro")})};
  $("#bLoad").onclick=()=>{const ta=$("#bTxt");if(ta.classList.contains("hide")||!ta.value.trim()){ta.classList.remove("hide");ta.focus();return}try{const o=JSON.parse(ta.value);KEYS.forEach(k=>{if(o[k]){merge(k,o[k]);save(k)}});toast("Datos restaurados");render(VIEW)}catch(e){toast("El texto no es un respaldo válido")}};
  const ent=Object.entries(S.body.w).sort();
  if(!ent.length)$("#cWfb").textContent="Todavía no hay pesajes. Cargá el primero arriba.";
  else{const roll=ent.map(([d])=>{const dd=parse(d),w=ent.filter(([x])=>{const xd=parse(x);return xd<=dd&&(dd-xd)<7*864e5});return +(w.reduce((a,[,v])=>a+v,0)/w.length).toFixed(2)});
    svgLine($("#cW"),ent.map(([d])=>fmt(parse(d))),[{label:"Pesaje diario",data:ent.map(([,v])=>v),color:"#4f7a63",dots:true},{label:"Promedio 7 días",data:roll,color:"#3DDC84",line:true,area:true}])}
  if(we.length&&$("#cC"))svgLine($("#cC"),we.map(([d])=>fmt(parse(d))),[{label:"Cintura (cm)",data:we.map(([,v])=>v),color:"#FFC857",line:true,dots:true}]);
}

/* ===================== RESUMEN PARA EL SERVIDOR ===================== */
function missingList(k){const d=S.daily[k]||{m:[]},dt=parse(k),train=isTrain(dt)&&weekOf(dt)>0,out=[];const mm=(d.m||[]).filter(Boolean).length;
  if(mm<5)out.push(`${5-mm} comida${5-mm>1?"s":""}`);if((d.water||0)<(train?9:8))out.push("agua");if(!d.crea)out.push("creatina");if(!d.steps)out.push("pasos");if(!S.body.w[k])out.push("pesarte");if(train&&!sessOn(k))out.push("gimnasio");return out}
function summary(){const t=today(),k=iso(t),D=S.daily[k]||{m:[]},sc=score(k);
  return{date:k,start:S.settings.start,water:D.water||0,crea:!!D.crea,stepsDone:!!D.steps,meals:(D.m||[]).filter(Boolean).length,weighed:!!S.body.w[k],waist:!!S.body.waist[k],trained:sessOn(k),next:nextSession(),pct:sc.pct,minOk:!!sc.minOk,streak:streakInfo().cur,revDone:!!(S.mind&&S.mind.rev&&S.mind.rev[iso(mondayOf(t))]),prefs:S.settings.notif||{},missing:missingList(k)}}
/* ===================== PASOS (Apple Salud vía Atajos) ===================== */
function stepsToday(){return STEPS&&STEPS.date===iso(today())?STEPS.steps:null}
function applySteps(){const n=stepsToday();if(n===null)return;const t=today(),w=Math.max(1,weekOf(t));const D=day(iso(t));if(n>=stepsGoal(w)&&!D.steps){D.steps=true;lsSet("daily",S.daily);lsRawSet("updatedAt",String(Date.now()));toast("👟 ¡Objetivo de pasos cumplido!")}}
function stepsTxt(w){const n=stepsToday(),g=stepsGoal(Math.max(1,w));if(n===null)return`<span>Objetivo de esta semana · <u data-stepsetup>sincronizar con el Apple Watch</u></span>`;
  const at=new Date(STEPS.at);return`<span>${n.toLocaleString("es-AR")} pasos a las ${pad(at.getHours())}:${pad(at.getMinutes())}${n<g?` · faltan ${(g-n).toLocaleString("es-AR")}`:""}</span><div class="tr" style="height:5px;background:#0c1310;border-radius:5px;margin-top:6px;overflow:hidden"><i style="display:block;height:100%;width:${Math.min(100,n/g*100)}%;background:var(--grad)"></i></div>`}
function stepsURL(){return`${location.origin}/api/steps?uid=${uid()}&steps=`}
function openStepsSetup(){openSheet(`<h3>👟 Pasos automáticos desde el Apple Watch</h3><div class="mut" style="font-size:14px;margin-bottom:10px">Una web no puede leer Apple Salud directamente. Con un Atajo de iPhone, tus pasos llegan solos a la app y a las notificaciones ("vas 4.200 de 7.000"). Se configura una sola vez y tarda 3 minutos.</div>
  <div class="cat">1. Copiá tu link personal</div><div class="note" style="word-break:break-all;font-size:12px">${esc(stepsURL())}</div><button class="btn ghost sm" id="cpU">📋 Copiar link</button>
  <div class="cat">2. Creá la automatización en la app Atajos</div>
  ${["Abrí <b>Atajos</b> → pestaña <b>Automatización</b> → <b>+</b> → <b>Hora del día</b>.","Elegí <b>11:45</b>, repetir <b>Diariamente</b> y marcá <b>Ejecutar inmediatamente</b>.","Agregá la acción <b>Buscar muestras de Salud</b>: tipo <b>Pasos</b>, con <b>Fecha de inicio</b> = <b>Hoy</b>.","Agregá <b>Calcular estadísticas</b> → <b>Suma</b> (de las muestras de Salud).","Agregá <b>Obtener contenido de URL</b> y pegá tu link. Al final, tocá y agregá la variable <b>Estadísticas</b> (queda <i>…&steps=Estadísticas</i>).","Repetí la automatización a las <b>17:45</b> y a las <b>21:45</b> (o duplicala y cambiá la hora)."].map((t,i)=>`<div class="tip"><span class="e">${i+1}.</span><div>${t}</div></div>`).join("")}
  <div class="note g" style="margin-top:10px">A las 12 y a las 18 te llega cómo venís con los pasos. Cuando llegás al objetivo, el hábito se marca solo.</div>`,b=>b.querySelector("#cpU").onclick=()=>navigator.clipboard.writeText(stepsURL()).then(()=>toast("📋 Link copiado")).catch(()=>toast("Copialo manteniendo apretado")))}
/* ===================== NOTIFICACIONES PUSH ===================== */
const NCATS=[["agua","💧 Agua","cada hora, solo si venís atrasado"],["creatina","💊 Creatina","9 y 13 h, si no la marcaste"],["comidas","🍽️ Comidas","almuerzo, snack y cena con postre y previa"],["pasos","👟 Pasos","12 y 18 h, cómo venís"],["entreno","🏋️ Gimnasio","lunes, miércoles y viernes a las 17 y a las 20 h si no fuiste"],["peso","⚖️ Pesarte","8 h, si no lo cargaste"],["resumen","🔥 Resumen","22 h, racha y lo que falta, y revisión del domingo"],["cocina","🛒 Compras y batch","sábado y domingo a las 10 h"]];
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
function b64u(s){const p="=".repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,"+").replace(/_/g,"/"),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
function showInstall(){openSheet(`<h3>📲 Instalá la app en tu iPhone</h3><div class="mut" style="font-size:14px;margin-bottom:10px">En iPhone, las notificaciones solo funcionan si la app está agregada a la pantalla de inicio.</div>
  ${["Abrí esta página en <b>Safari</b>.","Tocá el botón <b>Compartir</b> (el cuadrado con la flecha).","Elegí <b>Agregar a inicio</b> → <b>Agregar</b>.","Abrí la app desde el ícono nuevo y tocá <b>Activar notificaciones</b>."].map((t,i)=>`<div class="tip"><span class="e">${i+1}.</span><div>${t}</div></div>`).join("")}
  <div class="note g" style="margin-top:10px">Lo que ya cargaste se sincroniza solo con tu código.</div>`)}
async function enablePush(){
  if(isIOS()&&!standalone())return showInstall();
  if(!pushOK()){toast("Este navegador no soporta notificaciones");return}
  try{const perm=await Notification.requestPermission();if(perm!=="granted"){toast("Permiso denegado: activalo en Ajustes > Notificaciones");return}
    const reg=await navigator.serviceWorker.ready;const{key}=await(await fetch(API+"/vapid")).json();if(!key){toast("Falta configurar las claves VAPID en Netlify");return}
    let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    const r=await fetch(API+"/subscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({uid:uid(),sub:sub.toJSON()})});if(!r.ok)throw 0;
    S.settings.pushOn=true;save("settings");pushData();confetti(80);toast("🔔 Notificaciones activadas");render(VIEW)}catch(e){toast("No se pudo activar. Probá de nuevo")}}
async function testPush(){try{const r=await fetch(API+"/test",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({uid:uid()})});const j=await r.json();toast(j.sent?"Enviada: llega en segundos":"No hay dispositivos suscritos. Activalas primero")}catch(e){toast("Sin conexión")}}
async function diagPush(){const rows=[];const ok=(c,t,f)=>rows.push(`<div class="tip"><span class="e">${c?"✅":"❌"}</span><div><b>${t}</b>${!c&&f?`<div class="mut">${f}</div>`:""}</div></div>`);
  ok(!isIOS()||standalone(),"Abierta desde el ícono de inicio","En iPhone, abrila desde el ícono de la pantalla de inicio, no desde Safari.");
  ok(pushOK(),"El dispositivo soporta notificaciones","Actualizá iOS a 16.4 o superior.");
  const perm=("Notification" in window)?Notification.permission:"no";ok(perm==="granted","Permiso de notificaciones concedido",perm==="denied"?"Está bloqueado: Ajustes del iPhone → Notificaciones → Plan 12 → Permitir.":"Tocá Activar notificaciones y después Permitir.");
  let sub=null;try{const reg=await navigator.serviceWorker.ready;sub=await reg.pushManager.getSubscription()}catch(e){}
  ok(!!sub,"Este equipo está suscrito","Tocá Activar notificaciones.");
  let s=null;try{s=await(await fetch(API+"/status?uid="+encodeURIComponent(uid()),{cache:"no-store"})).json()}catch(e){}
  if(!s)ok(false,"Servidor","No responde /api/status. Revisá que el último deploy de Netlify haya terminado bien.");
  else{ok(s.vapid,"Claves VAPID cargadas en Netlify","Faltan las variables VAPID_* en Netlify, o falta Trigger deploy después de cargarlas.");
    ok(s.devices>0,`Dispositivos registrados en el servidor: ${s.devices}`,"Tocá Activar notificaciones otra vez.");
    const lr=s.lastRun;ok(!!lr&&Date.now()-lr.at<2*3600e3,lr?`El programador corrió a las ${new Date(lr.at).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}${lr.sent!==undefined?` · envió ${lr.sent}`:""}`:"El programador todavía no corrió","Corre cada hora en punto. Si después de una hora sigue así, avisame.");}
  openSheet(`<h3>🔧 Diagnóstico de notificaciones</h3>${rows.join("")}<button class="btn w" style="margin-top:12px" id="dT">Enviar una de prueba</button>`,b=>b.querySelector("#dT").onclick=testPush)}
function notifCard(){const p=S.settings.notif||{};return`<div class="card" id="notifCard"><h2>🔔 Notificaciones<span class="mut">${S.settings.pushOn?"activadas":"desactivadas"}</span></h2>
  <div class="mut" style="margin-bottom:10px">Se programan solas según la hora y lo que ya hiciste hoy: si ya tomaste la creatina, no te la recuerdan. También llegan al Apple Watch.</div>
  <div class="inl" style="margin-bottom:10px"><button class="btn sm" id="nOn">${S.settings.pushOn?"Reactivar en este equipo":"Activar notificaciones"}</button><button class="btn ghost sm" id="nTest">Probar</button><button class="btn ghost sm" id="nDiag">Diagnóstico</button></div>
  <div class="list">${NCATS.map(([k,t,d])=>`<div class="it ${p[k]!==false?"on":""}" data-nc="${k}"><div class="ck"></div><div><div class="t" style="text-decoration:none;opacity:1">${t}</div><div class="d" style="text-decoration:none;opacity:1">${d}</div></div></div>`).join("")}</div>
  <button class="btn ghost sm" style="margin-top:10px" id="nSteps">👟 Sincronizar pasos del Apple Watch</button>
  <div class="cat">Código de sincronización</div><div class="mut" style="margin-bottom:6px">Usalo para ver tus datos en otro equipo (por ejemplo, la compu). Es privado: no lo compartas.</div>
  <div class="inl"><input id="uidIn" value="${esc(uid())}" style="font-size:12px"><button class="btn ghost sm" id="uidB">Usar este</button></div></div>`}
function bindNotif(V){if(!V.querySelector("#notifCard"))return;
  V.querySelector("#nOn").onclick=enablePush;V.querySelector("#nDiag").onclick=diagPush;V.querySelector("#nTest").onclick=testPush;V.querySelector("#nSteps").onclick=openStepsSetup;
  V.querySelectorAll("[data-nc]").forEach(el=>el.onclick=()=>{S.settings.notif=S.settings.notif||{};const k=el.dataset.nc;S.settings.notif[k]=S.settings.notif[k]===false;save("settings");el.classList.toggle("on",S.settings.notif[k]!==false)});
  V.querySelector("#uidB").onclick=async()=>{const v=V.querySelector("#uidIn").value.trim();if(!/^[A-Za-z0-9-]{8,64}$/.test(v)){toast("Código inválido");return}if(v===uid())return;lsRawSet("uid",v);lsRawSet("updatedAt","0");await pullData();if(S.settings.pushOn)enablePush();toast("Equipo vinculado");render(VIEW)}}

/* ===================== INICIO ===================== */
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
render("hoy");initStore();
</script>
</body>
</html>
